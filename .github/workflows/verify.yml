name: Verify playable ZIGSO
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zigso-verification
  cancel-in-progress: true
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Geometry and syntax
        run: |
          npm test
          node --check app.js
          node --check assets.js
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Play the public mobile game
        run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: zigso-browser-results
          path: test-results/
          retention-days: 14
